<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | QuickPrint Campus</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="QuickPrint Campus home">
      <span class="brand-mark">QP</span>
      <span>QuickPrint <strong>Campus</strong></span>
    </a>
    <a class="btn btn-secondary" href="login.html">Already have an account?</a>
  </header>

  <main class="auth-shell">
    <section class="auth-card">
      <p class="section-label">NEW ACCOUNT</p>
      <h1>Create your student profile.</h1>
      <form id="registerForm" class="auth-form" data-action="register" data-redirect-to="student-dashboard.html">
        <div class="field-group">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" placeholder="Enter your full name" required>
        </div>
        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field-group">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" placeholder="9876543210" required>
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a secure password" required>
        </div>
        <button class="primary-btn" type="submit">Register</button>
        <div class="message-box" aria-live="polite"></div>
      </form>
      <p class="muted" style="margin-top:18px; text-align:center;">Already registered? <a href="login.html">Login instead</a></p>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
